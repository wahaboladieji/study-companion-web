<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <!-- primary40: #185fc3 -->
  <rect width="480" height="480" rx="96" fill="#185fc3"/>
  <!-- Simplified brain/book mark in on-primary: #ffffff -->
  <g transform="translate(240,240)" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left brain curve -->
    <path d="M-10,-90 C-70,-90 -110,-50 -110,0 C-110,40 -85,70 -50,80"/>
    <!-- Right brain curve -->
    <path d="M10,-90 C70,-90 110,-50 110,0 C110,40 85,70 50,80"/>
    <!-- Center connection -->
    <path d="M-10,-90 L10,-90"/>
    <path d="M-50,80 C-20,90 20,90 50,80"/>
    <!-- Inner detail left -->
    <path d="M-80,-30 C-60,-50 -30,-50 -10,-40" stroke-width="20"/>
    <!-- Inner detail right -->
    <path d="M80,-30 C60,-50 30,-50 10,-40" stroke-width="20"/>
    <!-- Center line -->
    <path d="M0,-90 L0,50" stroke-width="18"/>
    <!-- Sparkle dots -->
    <circle cx="-55" cy="20" r="8" fill="#ffffff" stroke="none"/>
    <circle cx="55" cy="20" r="8" fill="#ffffff" stroke="none"/>
  </g>
</svg>